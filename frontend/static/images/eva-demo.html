<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eva 4K Demo</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#02050b;color:#eafaff;
 font-family:Arial,sans-serif;overflow:hidden;
}
.scene{
 min-height:100vh;display:grid;place-items:center;
 position:relative;isolation:isolate;overflow:hidden;
 background:
 radial-gradient(ellipse at 50% 45%,#063d60 0%,#061526 35%,#02050b 75%);
}
.codes{
 position:absolute;inset:0;opacity:.25;overflow:hidden;
 color:#00cfff;font:13px monospace;line-height:1.8;
 overflow-wrap:anywhere;word-break:break-all;
 text-shadow:0 0 8px #00bfff;
}
.codes::before{
 content:"010101  const EVA = AI();  010010  SYSTEM ONLINE  ";
 position:absolute;inset:-30%;font-size:22px;
 letter-spacing:7px;line-height:2.5;
 transform:rotate(-14deg);
}
.glow{
 position:absolute;width:70vw;height:70vw;
 max-width:700px;max-height:700px;border-radius:50%;
 background:#008cff;filter:blur(130px);opacity:.15;
}
.robot{
 position:relative;width:min(90vw,850px);
 aspect-ratio:1/1;display:grid;place-items:center;
}
.robot img{
 width:100%;height:100%;object-fit:contain;
 filter:drop-shadow(0 0 22px #008cff)
        drop-shadow(0 0 55px #0077ff88);
 animation:float 5s ease-in-out infinite;
}
.shard{
 position:absolute;width:65px;height:90px;
 border:1px solid #8beaffaa;
 background:linear-gradient(135deg,#b9f5ff44,#00aaff08);
 clip-path:polygon(50% 0,100% 35%,72% 100%,10% 70%);
 box-shadow:0 0 20px #00bfff;
 animation:drift 7s ease-in-out infinite alternate;
}
.s1{top:17%;left:12%;transform:rotate(22deg)}
.s2{top:25%;right:12%;transform:rotate(55deg) scale(.7)}
.s3{bottom:20%;left:20%;transform:rotate(80deg) scale(.6)}
.s4{bottom:15%;right:18%;transform:rotate(10deg) scale(.9)}
.label{
 position:absolute;bottom:6%;text-align:center;
 letter-spacing:5px;color:#76eaff;
 text-shadow:0 0 15px #00bfff;
 font-size:clamp(12px,2vw,19px);
}
.label small{display:block;margin-top:10px;letter-spacing:3px;color:#9baebd}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes drift{from{translate:0 0;rotate:0deg}to{translate:12px -20px;rotate:18deg}}
</style>
</head>
<body>
<div class="scene">
 <div class="codes"></div>
 <div class="glow"></div>
 <div class="shard s1"></div>
 <div class="shard s2"></div>
 <div class="shard s3"></div>
 <div class="shard s4"></div>
 <div class="robot">
  <img src="https://images.unsplash.com/photo-1485827404703-89b55fcc595e?auto=format&fit=max&w=3840&q=100"
       alt="Futuristic robot" onerror="this.style.display='none'">
 </div>
 <div class="label">E V A <small>ARTIFICIAL INTELLIGENCE</small></div>
</div>
</body>
</html>
